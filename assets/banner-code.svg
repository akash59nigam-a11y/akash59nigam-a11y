<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Akash Nigam, Data Engineering and AI/ML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#141B3D"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>

    <g filter="url(#soft)">
      <circle cx="120" cy="260" r="140" fill="#8B5CF6" fill-opacity="0.45"/>
      <circle cx="980" cy="160" r="190" fill="#22D3EE" fill-opacity="0.32">
        <animate attributeName="r" values="190;215;190" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
      <text x="72" y="104" font-size="19" font-weight="500" fill="#22D3EE" font-family="'Fira Code','Cascadia Code',Consolas,'Courier New',monospace">~/akash $ whoami</text>
      <text x="72" y="180" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#nameFill)">Akash Nigam
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      </text>
      <text x="72" y="228" font-size="25" font-weight="500" fill="#CBD5E1">Data Engineering  •  AI / ML</text>
      <text x="72" y="264" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="0.8">BCA Student  ·  GFG Campus Mantri</text>
    </g>

    <g>
      <rect x="730" y="48" width="480" height="224" rx="14" fill="#0D1117" fill-opacity="0.92" stroke="#30363D"/>
      <circle cx="758" cy="74" r="6" fill="#FF5F56"/>
      <circle cx="780" cy="74" r="6" fill="#FFBD2E"/>
      <circle cx="802" cy="74" r="6" fill="#27C93F"/>
      <line x1="730" y1="96" x2="1210" y2="96" stroke="#30363D"/>

      <g font-family="'Fira Code','Cascadia Code',Consolas,'Courier New',monospace" font-size="18">
        <text x="758" y="132"><tspan fill="#C4B5FD">akash</tspan><tspan fill="#E6EDF3"> = {</tspan></text>
        <text x="786" y="162"><tspan fill="#7DD3FC">"focus"</tspan><tspan fill="#E6EDF3">: [</tspan><tspan fill="#86EFAC">"Data Eng"</tspan><tspan fill="#E6EDF3">, </tspan><tspan fill="#86EFAC">"AI/ML"</tspan><tspan fill="#E6EDF3">],</tspan></text>
        <text x="786" y="192"><tspan fill="#7DD3FC">"building"</tspan><tspan fill="#E6EDF3">: </tspan><tspan fill="#86EFAC">"in public"</tspan><tspan fill="#E6EDF3">,</tspan></text>
        <text x="786" y="222"><tspan fill="#7DD3FC">"learning"</tspan><tspan fill="#E6EDF3">: </tspan><tspan fill="#86EFAC">"every day"</tspan><tspan fill="#E6EDF3">,</tspan></text>
        <text x="758" y="252" fill="#E6EDF3">}</text>
      </g>
      <rect x="778" y="236" width="10" height="20" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
